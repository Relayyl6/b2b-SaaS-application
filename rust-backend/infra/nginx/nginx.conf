events {}

http {
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream users_backend {
        server user-management:3004;
    }

    upstream products_backend {
        server product-catalog:3003;
    }

    upstream orders_backend {
        server order-service:3005;
    }

    upstream inventory_backend {
        server inventory-management:3006;
    }

    upstream logistics_backend {
        server logistics:3008;
    }

    upstream notifications_backend {
        server notifications:3009;
    }

    upstream payments_backend {
        server payments:3010;
    }

    upstream suppliers_backend {
        server supplier-management:3011;
    }

    server {
        listen 80;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location = /health {
            return 200 '{"status":"ok","service":"api-gateway"}';
            add_header Content-Type application/json;
        }

        location = /_auth {
            internal;
            proxy_pass http://users_backend/auth/validate;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Authorization $http_authorization;
        }

        location /signup { proxy_pass http://users_backend; }
        location /signin { proxy_pass http://users_backend; }
        location /signout { proxy_pass http://users_backend; }
        location /get_user { proxy_pass http://users_backend; }
        location /protected/ { auth_request /_auth; proxy_pass http://users_backend; }

        location /products { auth_request /_auth; proxy_pass http://products_backend; }
        location /assets/ { proxy_pass http://products_backend; }

        location /orders { auth_request /_auth; proxy_pass http://orders_backend; }

        location /inventory { auth_request /_auth; proxy_pass http://inventory_backend; }

        location /shipments { auth_request /_auth; proxy_pass http://logistics_backend; }

        location /notifications { auth_request /_auth; proxy_pass http://notifications_backend; }
        location /notification-devices { auth_request /_auth; proxy_pass http://notifications_backend; }
        location /payments { auth_request /_auth; proxy_pass http://payments_backend; }
        location /suppliers { auth_request /_auth; proxy_pass http://suppliers_backend; }
    }
}
