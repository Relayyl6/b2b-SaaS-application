events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=10s ipv6=off;
    
    # Rate limiting zone
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Content-Security-Policy "default-src 'self'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Global configs
    client_max_body_size 10M;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;

    upstream users_backend { server user-management:3004; }
    upstream products_backend { server product-catalog:3003; }
    upstream orders_backend { server order-service:3005; }
    upstream inventory_backend { server inventory-management:3006; }
    upstream logistics_backend { server logistics:3008; }
    upstream notifications_backend { server notifications:3009; }
    upstream payments_backend { server payments:3010; }
    upstream suppliers_backend { server supplier-management:3011; }
    upstream analytics_backend { server analytics:3007; }

    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name _;

        # Note: certificates must be mounted via docker-compose
        ssl_certificate /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location = /health {
            return 200 '{"status":"ok","service":"api-gateway"}';
            add_header Content-Type application/json;
        }

        location = /_auth {
            internal;
            proxy_pass http://users_backend/auth/validate;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-API-Key $http_x_api_key;
            proxy_set_header X-Tenant-Tier $http_x_tenant_tier;
        }

        # Apply rate limit to all locations
        limit_req zone=api_limit burst=20 nodelay;

        location /signup { proxy_pass http://users_backend; }
        location /signin { proxy_pass http://users_backend; }
        location /signout { proxy_pass http://users_backend; }
        location /get_user { proxy_pass http://users_backend; }

        location /protected/ {
            auth_request /_auth;
            auth_request_set $tenant_id $upstream_http_x_tenant_id;
            auth_request_set $tenant_tier $upstream_http_x_tenant_tier;
            auth_request_set $user_id $upstream_http_x_user_id;
            auth_request_set $tenant_permissions $upstream_http_x_tenant_permissions;

            proxy_set_header X-Tenant-Id $tenant_id;
            proxy_set_header X-Tenant-Tier $tenant_tier;
            proxy_set_header X-User-Id $user_id;
            proxy_set_header X-Tenant-Permissions $tenant_permissions;
            proxy_pass http://users_backend;
        }

        location /products {
            auth_request /_auth;
            auth_request_set $tenant_id $upstream_http_x_tenant_id;
            auth_request_set $tenant_tier $upstream_http_x_tenant_tier;
            auth_request_set $user_id $upstream_http_x_user_id;
            auth_request_set $tenant_permissions $upstream_http_x_tenant_permissions;

            proxy_set_header X-Tenant-Id $tenant_id;
            proxy_set_header X-Tenant-Tier $tenant_tier;
            proxy_set_header X-User-Id $user_id;
            proxy_set_header X-Tenant-Permissions $tenant_permissions;
            proxy_pass http://products_backend;
        }

        location /assets/ { proxy_pass http://products_backend; }

        location /orders {
            auth_request /_auth;
            auth_request_set $tenant_id $upstream_http_x_tenant_id;
            auth_request_set $tenant_tier $upstream_http_x_tenant_tier;
            auth_request_set $user_id $upstream_http_x_user_id;
            auth_request_set $tenant_permissions $upstream_http_x_tenant_permissions;

            proxy_set_header X-Tenant-Id $tenant_id;
            proxy_set_header X-Tenant-Tier $tenant_tier;
            proxy_set_header X-User-Id $user_id;
            proxy_set_header X-Tenant-Permissions $tenant_permissions;
            proxy_pass http://orders_backend;
        }

        location /inventory {
            auth_request /_auth;
            auth_request_set $tenant_id $upstream_http_x_tenant_id;
            auth_request_set $tenant_tier $upstream_http_x_tenant_tier;
            auth_request_set $user_id $upstream_http_x_user_id;
            auth_request_set $tenant_permissions $upstream_http_x_tenant_permissions;

            proxy_set_header X-Tenant-Id $tenant_id;
            proxy_set_header X-Tenant-Tier $tenant_tier;
            proxy_set_header X-User-Id $user_id;
            proxy_set_header X-Tenant-Permissions $tenant_permissions;
            proxy_pass http://inventory_backend;
        }

        location /shipments {
