            proxy_pass http://suppliers_backend;
        }

        location /analytics {
            auth_request /_auth;
            auth_request_set $tenant_id $upstream_http_x_tenant_id;
            auth_request_set $tenant_tier $upstream_http_x_tenant_tier;
            auth_request_set $user_id $upstream_http_x_user_id;
            auth_request_set $tenant_permissions $upstream_http_x_tenant_permissions;

            proxy_set_header X-Tenant-Id $tenant_id;
            proxy_set_header X-Tenant-Tier $tenant_tier;
            proxy_set_header X-User-Id $user_id;
            proxy_set_header X-Tenant-Permissions $tenant_permissions;
            proxy_pass http://analytics_backend;
        }
    }
}
